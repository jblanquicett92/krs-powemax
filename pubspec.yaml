name: powermax_1rm
description: A premium, offline-first 1RM Calculator & AI Gym Coach in Flutter.
version: 1.15.1+12

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Localisation
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State Management
  flutter_riverpod: ^2.5.1

  # UI & Design
  google_fonts: ^6.2.1
  fl_chart: ^0.66.0
  shared_preferences: ^2.3.2
  system_info_plus: ^0.0.6
  flutter_markdown: ^0.7.4
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/default_routines.json
    - assets/pubspec.yaml
    - assets/logo.png
    - assets/logo_no_background.png
